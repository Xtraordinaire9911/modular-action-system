name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Supersede in-flight runs for the same ref so a stale red run cannot be
# mistaken for the current state of a branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports

      - name: Tests (pytest)
        run: pytest --tb=short -q

      - name: Demo smoke
        run: python run_demo.py

  # The fast suite runs in seconds and never opens a browser, so it cannot
  # corroborate a single claim about live behaviour. These do: each one asserts
  # something the README states, against a real page, and fails if it stops
  # being true. Kept as its own job so a browser problem is distinguishable at a
  # glance from a logic problem.
  live-browser:
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Live claims (pytest -m live)
        run: pytest --tb=short -q -m live

  # Runs on pull requests as well: gating the image build behind `push` meant a
  # broken Dockerfile passed review and only turned the branch red after the
  # merge landed on develop/main.
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and validate builder stage
        run: docker build --target builder -t action-system-builder:${{ github.sha }} .

      - name: Build production image
        run: docker build --target runner -t action-system:${{ github.sha }} .

      # Building is the CI gate. Publishing the large image is a best-effort
      # convenience for main and must not make develop fail when storage is full.
      - name: Export and archive image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save action-system:${{ github.sha }} | gzip > artifact.tar.gz

      - name: Archive artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: action-system-${{ github.sha }}
          path: artifact.tar.gz
          retention-days: 1
