name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports
      - name: Tests (pytest)
        run: |
          if [ -f pyproject.toml ]; then
            pytest --tb=short -q
          else
            echo "No pyproject.toml on this branch; skipping pytest (tests run on develop after all PRs merge)"
          fi

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export production image
        run: |
          docker build --target runner -t action-system:${{ github.sha }} .
          docker save action-system:${{ github.sha }} | gzip > artifact.tar.gz

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: action-system-${{ github.sha }}
          path: artifact.tar.gz
          retention-days: 14
