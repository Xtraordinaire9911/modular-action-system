name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Supersede in-flight runs for the same ref so a stale red run cannot be
# mistaken for the current state of a branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports

      - name: Tests (pytest)
        run: pytest --tb=short -q

      - name: Demo smoke
        run: python run_demo.py

  # Runs on pull requests as well: gating the image build behind `push` meant a
  # broken Dockerfile passed review and only turned the branch red after the
  # merge landed on develop/main.
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        run: docker build --target runner -t action-system:${{ github.sha }} .

      - name: Export and archive image
        if: github.event_name == 'push'
        run: docker save action-system:${{ github.sha }} | gzip > artifact.tar.gz

      - name: Archive artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: action-system-${{ github.sha }}
          path: artifact.tar.gz
          retention-days: 14
