[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "action-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "anthropic",
    "openai",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.0",
    "flask>=3.0",
    # Ships an ffmpeg binary, so `--record` can hand back an mp4 without
    # anyone installing ffmpeg system wide. Optional: the demo falls back to
    # leaving the webm in place.
    "imageio-ffmpeg>=0.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Live tests launch a real browser and are excluded by default: the fast suite
# has to stay fast enough to run on every edit. They are not optional evidence
# though - CI runs them as a separate job, because a suite that never opens a
# browser cannot corroborate a single claim about live behaviour.
markers = [
  "live: needs a real browser (run with -m live)",
  # The smart room is a separate exclusion from `live`, and not a stricter one:
  # CI's live job has a browser but no Docker, so a smart-room test in `live`
  # would fail there for a reason that says nothing about the code. These run
  # against a servient someone started:
  #   docker compose -f env/docker-compose.yml up -d && pytest -m smartroom
  "smartroom: needs the WoT servient from env/docker-compose.yml (run with -m smartroom)",
]
addopts = "-m 'not live and not smartroom'"
